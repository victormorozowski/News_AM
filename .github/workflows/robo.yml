name: Robô de Notícias Amazonas

on:
  schedule:
    # Roda a cada 2 horas, das 07h às 21h no horário de Manaus (UTC-4)
    # 11:00 UTC = 07:00 Manaus
    # 13:00 UTC = 09:00 Manaus
    # 15:00 UTC = 11:00 Manaus
    # 17:00 UTC = 13:00 Manaus
    # 19:00 UTC = 15:00 Manaus
    # 21:00 UTC = 17:00 Manaus
    # 23:00 UTC = 19:00 Manaus
    - cron: '0 11,13,15,17,19,23 * * *'
  
  workflow_dispatch:

jobs:
  executar-robo:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar o Robô de Notícias
      run: python robo.py

    - name: Salvar as notícias atualizadas no repositório
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Atualização automática periódica de notícias"
        file_pattern: noticias_atualizadas.json
