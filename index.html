<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Inteligência - Notícias Amazonas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-cyan-400">Painel de Monitoramento - Amazonas</h1>
                <p class="text-xs text-slate-400">Inteligência Operacional • Atualização Diária</p>
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <input type="text" id="input-busca" placeholder="Pesquisar termo nas notícias..." 
                    class="bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-lg text-slate-200 focus:outline-none focus:border-cyan-500 w-full md:w-64"
                    oninput="filtrarNoticias()">
                <div id="status-atualizacao" class="text-xs bg-slate-700 px-3 py-2 rounded-lg text-slate-300 whitespace-nowrap">
                    Carregando...
                </div>
            </div>
        </div>

        <!-- Navegação Principal (Abas Principais + Temas) -->
        <div class="bg-slate-900/80 border-t border-slate-700/60 px-4 py-2">
            <div class="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto custom-scrollbar pb-1">
                <button onclick="mudarModoVisualizacao('diario')" id="btn-modo-diario" class="text-xs font-semibold px-4 py-2 rounded-lg bg-cyan-600 text-white whitespace-nowrap transition-all shadow">
                    Monitoramento Diário
                </button>
                <button onclick="mudarModoVisualizacao('historico')" id="btn-modo-historico" class="text-xs font-semibold px-4 py-2 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap transition-all">
                    Arquivo de Histórico
                </button>
                <div class="h-5 w-[1px] bg-slate-700 mx-1"></div>
                <!-- Abas dos Temas injetadas via JS -->
                <div id="container-abas-temas" class="flex items-center gap-2"></div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- Seletor de Data para o Histórico -->
        <div id="painel-seletor-historico" class="hidden mb-6 bg-slate-800 border border-slate-700 p-4 rounded-xl flex items-center gap-4">
            <label for="select-data" class="text-xs font-semibold text-slate-300">Selecione a Data do Relatório:</label>
            <select id="select-data" onchange="carregarHistoricoPorData()" class="bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-lg text-slate-200 focus:outline-none focus:border-cyan-500">
                <option value="">Carregando datas...</option>
            </select>
        </div>

        <div id="container-noticias" class="space-y-6">
            <div class="text-center py-20 text-slate-400">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-cyan-500 border-t-transparent mb-4"></div>
                <p>Processando relatórios...</p>
            </div>
        </div>
    </main>

    <footer class="bg-slate-800 border-t border-slate-700 mt-12 py-6 text-center text-xs text-slate-500">
        Painel restrito de monitoramento de fontes públicas — Amazonas.
    </footer>

    <script>
        let dadosAtuais = {};
        let historicoGeral = {};
        let modoAtual = 'diario'; // 'diario' ou 'historico'
        let temaSelecionado = 'TODOS';
        let termoBusca = '';

        async function inicializarPainel() {
            try {
                // Carrega dados do dia atual
                const respDiario = await fetch('/News_AM/noticias_atualizadas.json?t=' + new Date().getTime());
                if (respDiario.ok) {
                    dadosAtuais = await respDiario.json();
                }

                // Carrega o histórico geral
                const respHist = await fetch('/News_AM/historico_geral.json?t=' + new Date().getTime());
                if (respHist.ok) {
                    historicoGeral = await respHist.json();
                } else {
                    historicoGeral = { [new Date().toISOString().split('T')[0]]: dadosAtuais };
                }

                renderizarAbasTemas();
                renderizarConteudo();
            } catch (erro) {
                document.getElementById('container-noticias').innerHTML = `
                    <div class="bg-red-950/30 border border-red-900 text-red-300 p-4 rounded-xl text-center">
                        <p class="font-semibold">Erro ao carregar os dados.</p>
                        <p class="text-xs mt-1 text-red-400">Certifique-se de que o robô já executou na aba Actions do GitHub.</p>
                    </div>
                `;
            }
        }

        function mudarModoVisualizacao(modo) {
            modoAtual = modo;
            temaSelecionado = 'TODOS';
            document.getElementById('input-busca').value = '';
            termoBusca = '';

            const btnDiario = document.getElementById('btn-modo-diario');
            const btnHistorico = document.getElementById('btn-modo-historico');
            const painelHist = document.getElementById('painel-seletor-historico');

            if (modo === 'diario') {
                btnDiario.className = 'text-xs font-semibold px-4 py-2 rounded-lg bg-cyan-600 text-white whitespace-nowrap transition-all shadow';
                btnHistorico.className = 'text-xs font-semibold px-4 py-2 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap transition-all';
                painelHist.classList.add('hidden');
                renderizarAbasTemas();
                renderizarConteudo();
            } else {
                btnHistorico.className = 'text-xs font-semibold px-4 py-2 rounded-lg bg-cyan-600 text-white whitespace-nowrap transition-all shadow';
                btnDiario.className = 'text-xs font-semibold px-4 py-2 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap transition-all';
                painelHist.classList.remove('hidden');
                popularSeletorDatas();
            }
        }

        function popularSeletorDatas() {
            const select = document.getElementById('select-data');
            select.innerHTML = '';
            const datas = Object.keys(historicoGeral).sort().reverse();

            if (datas.length === 0) {
                select.innerHTML = '<option value="">Nenhum histórico disponível</option>';
                return;
            }

            datas.forEach(data => {
                let opt = document.createElement('option');
                opt.value = data;
                opt.innerText = data.split('-').reverse().join('/'); // Formata para DD/MM/AAAA
                select.appendChild(opt);
            });

            // Seleciona a data mais recente por padrão
            carregarHistoricoPorData();
        }

        function carregarHistoricoPorData() {
            const dataSelecionada = document.getElementById('select-data').value;
            if (historicoGeral[dataSelecionada]) {
                dadosAtuais = historicoGeral[dataSelecionada];
                renderizarAbasTemas();
                renderizarConteudo();
            }
        }

        function renderizarAbasTemas() {
            const containerAbas = document.getElementById('container-abas-temas');
            containerAbas.innerHTML = '';

            const temas = ['TODOS', ...Object.keys(dadosAtuais)];

            temas.forEach(tema => {
                let btn = document.createElement('button');
                let ativo = temaSelecionado === tema;
                btn.className = `text-xs font-medium px-3 py-1.5 rounded-lg whitespace-nowrap transition-all ${
                    ativo ? 'bg-cyan-950 text-cyan-300 border border-cyan-700' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200'
                }`;
                btn.innerText = tema;
                btn.onclick = () => {
                    temaSelecionado = tema;
                    renderizarAbasTemas();
                    renderizarConteudo();
                };
                containerAbas.appendChild(btn);
            });
        }

        function filtrarNoticias() {
            termoBusca = document.getElementById('input-busca').value.toLowerCase();
            renderizarConteudo();
        }

        function renderizarConteudo() {
            const container = document.getElementById('container-noticias');
            container.innerHTML = '';

            let dadosParaExibir = {};
            if (temaSelecionado === 'TODOS') {
                dadosParaExibir = dadosAtuais;
            } else {
                dadosParaExibir = { [temaSelecionado]: dadosAtuais[temaSelecionado] };
            }

            let totalExibidos = 0;
            let totalTemas = Object.keys(dadosAtuais).length;
            document.getElementById('status-atualizacao').innerText = `${totalTemas} parâmetros monitorados`;

            for (let [tema, noticias] of Object.entries(dadosParaExibir)) {
                let secao = document.createElement('div');
                secao.className = 'bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg mb-6';

                let cabecalhoTema = document.createElement('h2');
                cabecalhoTema.className = 'text-lg font-semibold text-cyan-300 mb-4 pb-2 border-b border-slate-700 flex justify-between items-center';
                cabecalhoTema.innerHTML = `<span>${tema}</span>`;
                secao.appendChild(cabecalhoTema);

                let conteudoDiv = document.createElement('div');

                if (typeof noticias === 'string') {
                    if (!termoBusca || tema.toLowerCase().includes(termoBusca)) {
                        conteudoDiv.innerHTML = `<p class="text-sm text-slate-400 italic bg-slate-900/50 p-3 rounded-lg border border-slate-800">${noticias}</p>`;
                        totalExibidos++;
                    } else {
                        conteudoDiv.innerHTML = `<p class="text-sm text-slate-500 italic">Nenhum resultado para o filtro.</p>`;
                    }
                } else if (Array.isArray(noticias)) {
                    let noticiasFiltradas = noticias.filter(item => {
                        if (!termoBusca) return true;
                        return item.titulo.toLowerCase().includes(termoBusca) || 
                               item.resumo.toLowerCase().includes(termoBusca) || 
                               item.fonte.toLowerCase().includes(termoBusca);
                    });

                    if (noticiasFiltradas.length === 0) {
                        conteudoDiv.innerHTML = `<p class="text-sm text-slate-500 italic">Nenhuma notícia encontrada com o termo buscado neste tema.</p>`;
                    } else {
                        let listaCards = document.createElement('div');
                        listaCards.className = 'grid grid-cols-1 md:grid-cols-2 gap-4';

                        noticiasFiltradas.forEach(item => {
                            let card = document.createElement('div');
                            card.className = 'bg-slate-900/60 border border-slate-700/60 rounded-lg p-4 flex flex-col justify-between hover:border-cyan-500/50 transition-all';
                            
                            card.innerHTML = `
                                <div>
                                    <div class="flex justify-between items-start gap-2 mb-2">
                                        <span class="text-xs font-medium text-cyan-400 bg-cyan-950/50 px-2 py-0.5 rounded border border-cyan-800/50">${item.fonte}</span>
                                        <span class="text-xs text-slate-500">${item.data}</span>
                                    </div>
                                    <h3 class="text-sm font-semibold text-slate-100 mb-2">${item.titulo}</h3>
                                    <p class="text-xs text-slate-300 mb-4 leading-relaxed">${item.resumo}</p>
                                </div>
                                <a href="${item.link}" target="_blank" class="inline-flex items-center text-xs font-medium text-cyan-400 hover:text-cyan-300 transition-colors mt-2">
                                    Ler matéria completa &rarr;
                                </a>
                            `;
                            listaCards.appendChild(card);
                            totalExibidos++;
                        });
                        conteudoDiv.appendChild(listaCards);
                    }
                }

                secao.appendChild(conteudoDiv);
                container.appendChild(secao);
            }
        }

        inicializarPainel();
    </script>
</body>
</html>
